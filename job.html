<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0e0e10">
  <title>AI找工作 - 剑指OFFER | 实时搜索真实岗位，按简历算人岗匹配</title>
  <link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y="0.9em" font-size="90">⚔️</text></svg>'>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <main class="content" data-active="job">

    <section class="page-hero">
      <span class="watermark" aria-hidden="true">🤖</span>
      <p class="crumb"><a href="index.html">首页</a> / AI找工作</p>
      <h1 class="page-title">AI找工作 <em>·</em> 真实岗位实时搜索</h1>
      <p class="page-sub">岗位数据来自公开真实招聘接口（Arbeitnow / Remotive，可在设置中自定义），每一条都是实时在招的真实岗位，附直达申请链接。已上传简历的话，AI 会实时算出每个岗位与你的匹配度。</p>
      <div style="margin-top:14px;display:flex;gap:10px;flex-wrap:wrap">
        <a class="btn btn-ghost btn-sm" href="autofill.html">📄 还没上传简历？去建立资料库</a>
        <button class="btn btn-ghost btn-sm" data-open-settings type="button">⚙️ 更换数据源</button>
      </div>
    </section>

    <section class="panel reveal">
      <div class="toolbar">
        <div class="search"><input id="kwInput" type="text" placeholder="搜索岗位关键词，如 frontend / data / product" aria-label="岗位关键词"></div>
        <input id="locInput" type="text" placeholder="地点筛选，如 Berlin / Remote" style="border-radius:999px;border:1px solid var(--border);background:var(--bg-soft);color:var(--text);padding:10px 16px;font-size:13.5px;outline:none" aria-label="地点筛选">
        <label class="switch"><input type="checkbox" id="remoteOnly"><span class="track"></span>只要远程</label>
        <select id="sourceSel" aria-label="数据源">
          <option value="arbeitnow">数据源：Arbeitnow</option>
          <option value="remotive">数据源：Remotive</option>
          <option value="custom">数据源：自定义</option>
        </select>
        <button class="btn btn-primary" id="searchBtn" type="button">🔍 搜索真实岗位</button>
      </div>

      <div id="profileHint" class="field-hint" style="margin-bottom:12px"></div>

      <div id="resultArea">
        <div class="empty-state">
          <p class="ico">⚔️</p>
          <b>输入关键词，开始搜索真实岗位</b>
          <p>例如：frontend、python、data analyst、product manager…</p>
        </div>
      </div>

      <div id="pager" style="display:none;margin-top:18px;justify-content:center;gap:12px;align-items:center">
        <button class="btn btn-ghost btn-sm" id="prevBtn" type="button">← 上一页</button>
        <span class="field-hint" id="pageInfo"></span>
        <button class="btn btn-ghost btn-sm" id="nextBtn" type="button">下一页 →</button>
      </div>
    </section>

  </main>

  <script src="js/common.js"></script>
  <script src="js/ai-engine.js"></script>
  <script src="js/job.js"></script>
</body>
</html>
